<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bulo SmartVille</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #003d70; color: white; font-family: 'Segoe UI', sans-serif; }
        .login-card { background: white; color: #333; border-radius: 25px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .btn-login { background: #003d70; color: white; border-radius: 12px; font-weight: bold; }
    </style>
</head>
<body class="d-flex align-items-center vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="login-card text-center">
                    <h4 class="fw-bold mb-4">Bulo SmartVille</h4>
                    <input type="number" id="nik" class="form-control mb-3 py-2" placeholder="Masukkan NIK">
                    <input type="password" id="pass" class="form-control mb-4 py-2" placeholder="Password">
                    <button class="btn btn-login w-100 py-2" onclick="handleLogin()">MASUK</button>
                    <div id="msg" class="small mt-3 text-danger"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            const nik = document.getElementById('nik').value;
            const pass = document.getElementById('pass').value;
            const msg = document.getElementById('msg');

            // Ganti URL ini dengan Web App URL Apps Script Anda
            const scriptURL = 'YOUR_APPS_SCRIPT_URL';

            fetch(scriptURL + "?action=login&nik=" + nik + "&pass=" + pass)
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        localStorage.setItem('USER_BULO', JSON.stringify(res.data));
                        const role = res.data.role.toLowerCase();

                        // Routing berdasarkan Role di Kolom J
                        if (role === 'admin' || role === 'kades') {
                            window.location.href = 'admin_panel.html';
                        } else if (role === 'kesehatan') {
                            window.location.href = 'kader_kesehatan.html';
                        } else if (role === 'sampah') {
                            window.location.href = 'kader_sampah.html';
                        } else {
                            window.location.href = 'dashboard_warga.html';
                        }
                    } else {
                        msg.innerText = "NIK atau Password salah!";
                    }
                });
        }
    </script>
</body>
</html>
