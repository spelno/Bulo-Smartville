<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulo SmartVille | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: radial-gradient(circle at top right, #003d70, #000b18); 
            height: 100vh; display: flex; align-items: center; font-family: 'Inter', sans-serif; color: white;
        }
        .login-card { 
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); 
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 35px; 
            padding: 50px 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); width: 100%; max-width: 400px; margin: auto;
        }
        .form-control { 
            background: rgba(255, 255, 255, 0.08); border: none; border-radius: 15px; 
            color: white; padding: 15px; text-align: center;
        }
        .form-control:focus { background: rgba(255, 255, 255, 0.15); color: white; box-shadow: none; }
        .btn-premium { 
            background: linear-gradient(45deg, #0062ff, #00c6ff); border: none; 
            border-radius: 15px; padding: 15px; font-weight: 700; letter-spacing: 1px; transition: 0.4s;
        }
        .btn-premium:hover { transform: scale(1.02); box-shadow: 0 10px 25px rgba(0, 98, 255, 0.4); }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <h2 class="fw-bold mb-1">BULO</h2>
        <p class="small opacity-50 mb-5" style="letter-spacing: 3px;">THE ESSENCE</p>
        <div class="mb-3"><input type="number" id="nik" class="form-control" placeholder="NIK"></div>
        <div class="mb-4"><input type="password" id="pass" class="form-control" placeholder="Password"></div>
        <button id="btnLogin" class="btn btn-primary btn-premium w-100" onclick="prosesLogin()">AUTHENTICATE</button>
        <div id="msg" class="text-warning small mt-4 fw-bold"></div>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbxVdX4uFlk42Rnr0PZSMp7ImBs_l_-RoqbRrPVt0AQPkMOspZE3aVltKyTYWew0frLHnw/exec'; // Ganti dengan URL Apps Script baru

        async function prosesLogin() {
            const nik = document.getElementById('nik').value;
            const pass = document.getElementById('pass').value;
            const btn = document.getElementById('btnLogin');
            if(!nik || !pass) return;
            
            btn.disabled = true; btn.innerText = "VERIFYING...";
            try {
                const response = await fetch(`${API_URL}?action=login&nik=${nik}&pass=${pass}`);
                const res = await response.json();
                if (res.success) {
                    localStorage.setItem('USER_BULO', JSON.stringify(res.data));
                    const role = res.data.role;
                    // Routing sesuai Role
                    if (role.includes('admin') || role === 'kades') window.location.href = 'admin_panel.html';
                    else if (role === 'kesehatan') window.location.href = 'kader_kesehatan.html';
                    else if (role === 'sampah') window.location.href = 'kader_sampah.html';
                    else window.location.href = 'dashboard_warga.html';
                } else {
                    document.getElementById('msg').innerText = "INVALID CREDENTIALS";
                    btn.disabled = false; btn.innerText = "AUTHENTICATE";
                }
            } catch (e) {
                document.getElementById('msg').innerText = "SYSTEM OFFLINE";
                btn.disabled = false; btn.innerText = "AUTHENTICATE";
            }
        }
    </script>
</body>
</html>
