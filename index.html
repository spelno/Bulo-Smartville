<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bulo SmartVille</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #f8fafd; font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh; display: flex; align-items: center; }
        .login-card { 
            background: white; border-radius: 30px; padding: 40px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.05); width: 100%; max-width: 400px; margin: auto;
        }
        .brand-name { font-weight: 800; color: #003d70; letter-spacing: -1px; }
        .form-control { 
            background: #f1f5f9; border: none; border-radius: 15px; padding: 12px 20px; margin-bottom: 15px;
        }
        .btn-login { 
            background: #003d70; color: white; border: none; border-radius: 15px; 
            padding: 12px; font-weight: 700; width: 100%; transition: 0.3s;
        }
        .btn-login:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <img src="https://cdn-icons-png.flaticon.com/512/1048/1048953.png" width="60" class="mb-3">
        <h3 class="brand-name">BULO SMARTVILLE</h3>
        <p class="text-muted small mb-4">Silakan masuk dengan NIK Anda</p>
        
        <input type="number" id="nik" class="form-control" placeholder="NIK">
        <input type="password" id="pass" class="form-control" placeholder="Password">
        
        <button id="btnLogin" class="btn-login" onclick="prosesLogin()">MASUK SYSTEM</button>
        <p id="msg" class="text-danger small mt-3 fw-bold"></p>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxhCEUv8Lwmmro8ssCZVPczZYyZs-5L7vZbmWZJ2Btxna3o4P1Gu131bBEGMUYcV2OyAg/exec";

        async function prosesLogin() {
            const nik = document.getElementById('nik').value;
            const pass = document.getElementById('pass').value;
            const btn = document.getElementById('btnLogin');
            
            if(!nik || !pass) return;
            btn.disabled = true; btn.innerText = "Memproses...";

            try {
                const response = await fetch(`${API_URL}?action=login&nik=${nik}&pass=${pass}`);
                const res = await response.json();
                
                if (res.success) {
                    // Simpan NIK sesuai kebutuhan Dashboard Bapak
                    localStorage.setItem('nik_login', nik);
                    localStorage.setItem('role_user', res.role);
                    
                    if(res.role === 'admin' || res.role === 'kades') {
                        window.location.href = "admin_panel.html";
                    } else {
                        window.location.href = "dashboard_warga.html";
                    }
                } else {
                    document.getElementById('msg').innerText = "NIK atau Password Salah";
                    btn.disabled = false; btn.innerText = "MASUK SYSTEM";
                }
            } catch (e) {
                document.getElementById('msg').innerText = "Koneksi Error";
                btn.disabled = false; btn.innerText = "MASUK SYSTEM";
            }
        }
    </script>
</body>
</html>
