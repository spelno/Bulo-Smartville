<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bulo SmartVille</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #003d70; --bg: #f8fafd; }
        body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overflow: hidden; }

        /* SPLASH SCREEN STYLE (ALA FACEBOOK/PREMIUM APP) */
        #splash-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
            background: white; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 0.8s ease-out, visibility 0.8s;
        }
        .splash-logo { width: 120px; margin-bottom: 25px; animation: pulse 2s infinite; }
        .splash-text { font-weight: 800; color: var(--primary); letter-spacing: 2px; text-align: center; }
        .splash-sub { font-size: 0.7rem; color: #888; letter-spacing: 4px; text-transform: uppercase; margin-top: 5px; }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        /* LOGIN PAGE STYLE */
        #login-content {
            height: 100vh; display: flex; align-items: center; justify-content: center;
            opacity: 0; transform: translateY(20px); transition: 1s ease-in-out;
        }
        .login-card { 
            background: white; border-radius: 35px; padding: 50px 40px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center;
        }
        .bulo-logo { width: 90px; margin-bottom: 20px; }
        .brand-name { font-weight: 800; color: var(--primary); font-size: 1.5rem; margin-bottom: 30px; letter-spacing: -0.5px; }
        
        .form-control { 
            background: #f1f5f9; border: 2px solid transparent; border-radius: 18px; 
            padding: 14px 20px; margin-bottom: 15px; transition: 0.3s;
        }
        .form-control:focus { border-color: var(--primary); background: white; box-shadow: none; }
        
        .btn-login { 
            background: var(--primary); color: white; border: none; border-radius: 18px; 
            padding: 15px; font-weight: 700; width: 100%; margin-top: 15px;
            box-shadow: 0 10px 20px rgba(0, 61, 112, 0.2); transition: 0.3s;
        }
        .btn-login:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(0, 61, 112, 0.3); }
        #msg { font-size: 0.8rem; font-weight: 700; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="Logo_UMMAN.jpg" alt="UMMAN" class="splash-logo">
        <div class="splash-text">HEBAT</div>
        <div class="splash-sub">Maju Dengan Pesat</div>
    </div>

    <div id="login-content" class="container">
        <div class="login-card">
            <img src="Logo_Bulo.png" alt="Bulo SmartVille" class="bulo-logo">
            <h4 class="brand-name">Bulo SmartVille</h4>
            
            <input type="number" id="nik" class="form-control text-center" placeholder="Nomor Induk (NIK)">
            <input type="password" id="pass" class="form-control text-center" placeholder="Password">
            
            <button id="btnLogin" class="btn-login" onclick="prosesLogin()">LOGIN KE SISTEM</button>
            <div id="msg" class="text-danger"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxhCEUv8Lwmmro8ssCZVPczZYyZs-5L7vZbmWZJ2Btxna3o4P1Gu131bBEGMUYcV2OyAg/exec";

        // Logic Splash Screen ala Facebook (3 detik)
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const content = document.getElementById('login-content');
                
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
                
                content.style.opacity = '1';
                content.style.transform = 'translateY(0)';
                document.body.style.overflow = 'auto';
            }, 3000); 
        });

        async function prosesLogin() {
            const nik = document.getElementById('nik').value;
            const pass = document.getElementById('pass').value;
            const btn = document.getElementById('btnLogin');
            const msg = document.getElementById('msg');
            
            if(!nik || !pass) {
                msg.innerText = "Isi NIK dan Password!";
                return;
            }

            btn.disabled = true; 
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Menghubungkan...';

            try {
                const response = await fetch(`${API_URL}?action=login&nik=${nik}&pass=${pass}`);
                const res = await response.json();
                
                if (res.success) {
                    localStorage.setItem('nik_login', nik);
                    window.location.href = (res.role === 'admin' || res.role === 'kades') ? "admin_panel.html" : "dashboard_warga.html";
                } else {
                    msg.innerText = "NIK atau Password Salah!";
                    btn.disabled = false; btn.innerText = "LOGIN KE SISTEM";
                }
            } catch (e) {
                msg.innerText = "Gangguan Jaringan!";
                btn.disabled = false; btn.innerText = "LOGIN KE SISTEM";
            }
        }
    </script>
</body>
</html>
