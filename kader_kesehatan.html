<div class="container py-4">
    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body text-center">
            <h6 class="fw-bold">SCAN KK / KTP WARGA</h6>
            <div id="video-container" class="bg-dark rounded-4 mb-3" style="height: 200px;">
                </div>
            <button class="btn btn-primary w-100 rounded-pill py-2 fw-bold" onclick="startScan()">MULAI SCAN</button>
        </div>
    </div>

    <div id="form-update" class="mt-4" style="display:none;">
        <div class="alert alert-info">
            Warga: <b id="nama-warga">-</b><br>
            NIK: <span id="nik-warga">-</span>
        </div>
        <div class="mb-3">
            <label class="small fw-bold">Tinggi Badan (cm)</label>
            <input type="number" id="tb" class="form-control rounded-3">
        </div>
        <div class="mb-3">
            <label class="small fw-bold">Berat Badan (kg)</label>
            <input type="number" id="bb" class="form-control rounded-3">
        </div>
        <div class="mb-3">
            <label class="small fw-bold">Penyakit Penyerta</label>
            <textarea id="penyakit" class="form-control rounded-3"></textarea>
        </div>
        <button class="btn btn-success w-100 py-3 fw-bold rounded-4" onclick="kirimData()">KIRIM KE ADMIN</button>
    </div>
</div>

<script>
    function startScan() {
        // Logika OCR KTP/KK yang kita bahas sebelumnya
        // Jika berhasil, panggil tampilkanForm(data)
    }

    function tampilkanForm(data) {
        document.getElementById('form-update').style.display = 'block';
        document.getElementById('nama-warga').innerText = data.nama;
        document.getElementById('nik-warga').innerText = data.nik;
    }

    function kirimData() {
        // Mengirim ke fungsi simpanKeAntrean() di Apps Script agar disetujui Admin
        alert("Data terkirim! Menunggu persetujuan Admin.");
    }
</script>
