<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Warga</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .header-gizi { background: #003d70; color: white; border-radius: 0 0 40px 40px; padding: 40px 20px; }
        .box-kecil { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 10px; border: 1px solid rgba(255,255,255,0.2); }
        .saran-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-left: 8px solid #ffc107; margin-top: -30px; padding: 25px; }
    </style>
</head>
<body class="bg-light">
    <div class="header-gizi text-center">
        <p class="mb-1 small opacity-75" id="info-bmi">STATUS BMI: - | BMI: -</p>
        <h1 class="display-3 fw-bold mb-4" id="total-kalori">0 <span class="h6">kkal</span></h1>
        
        <div class="row g-2 px-2">
            <div class="col-3"><div class="box-kecil"><b id="prot">0g</b><br><small style="font-size: 10px;">PROT</small></div></div>
            <div class="col-3"><div class="box-kecil"><h6 class="mb-0 fw-bold" id="lemak">0g</h6><small style="font-size: 10px;">LEMAK</small></div></div>
            <div class="col-3"><div class="box-kecil"><b id="karbo">0g</b><br><small style="font-size: 10px;">KARBO</small></div></div>
            <div class="col-3"><div class="box-kecil"><b id="besi">0mg</b><br><small style="font-size: 10px;">BESI</small></div></div>
        </div>
    </div>

    <div class="container mt-4">
        <div class="saran-card">
            <h6 class="fw-bold mb-3">💡 Ide Menu Sehat & Saran:</h6>
            <p id="teks-saran" class="text-muted mb-0 small" style="line-height: 1.6;">
                Memuat saran gizi terbaik untuk Anda...
            </p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('USER_BULO'));
            if(!user) window.location.href = 'index.html';

            // Contoh Logika Pengisian Data (Bisa dibuat dinamis berdasarkan BB/TB)
            document.getElementById('total-kalori').innerHTML = `1.715 <span class="h6">kkal</span>`;
            document.getElementById('info-bmi').innerText = `STATUS BMI: GEMUK | BMI: 28.7`;
            document.getElementById('prot').innerText = "216g";
            document.getElementById('lemak').innerText = "25g";
            document.getElementById('karbo').innerText = "143g";
            document.getElementById('besi').innerText = "50mg";
            
            document.getElementById('teks-saran').innerHTML = `
                Berdasarkan status Anda, kami menyarankan untuk mengganti nasi putih dengan <b>Jagung atau Ubi</b>. 
                Perbanyak konsumsi sayuran hijau seperti <b>Kangkung</b> untuk menyeimbangkan asupan zat besi 
                tanpa menambah lemak berlebih.
            `;
        });
    </script>
</body>
</html>
