<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Gizi - Bulo SmartVille</title>
    
    <script>
        if (!localStorage.getItem('nik_login')) { window.location.href = "index.html"; }
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #003d70; --bg: #f4f7fa; --danger: #e74c3c; --warning: #f1c40f; --success: #27ae60; }
        body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh; overflow: hidden; margin: 0; }
        
        /* Tampilan Dashboard Hasil (Atas) */
        .top-result {
            height: 65vh; background: var(--primary); color: white;
            padding: 25px; border-radius: 0 0 40px 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; position: relative;
        }
        .nav-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .btn-back { background: rgba(255,255,255,0.15); color: white; border: none; padding: 8px 15px; border-radius: 12px; font-weight: 700; font-size: 0.8rem; text-decoration: none; }
        
        .score-circle { width: 75px; height: 75px; border: 5px solid rgba(255,255,255,0.2); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .kkal-main { font-size: 3.5rem; font-weight: 800; line-height: 1; margin: 15px 0; }

        .bmi-mini { background: rgba(255,255,255,0.1); border-radius: 15px; padding: 10px 15px; display: flex; justify-content: space-between; margin-bottom: 15px; }
        
        .macro-box { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        .macro-item { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 15px; text-align: center; }
        .macro-item b { display: block; font-size: 0.9rem; }
        .macro-item small { font-size: 0.6rem; opacity: 0.7; font-weight: 700; }

        .feedback-card { background: white; color: #333; border-radius: 20px; padding: 15px; margin-top: auto; border-left: 6px solid var(--warning); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        /* Tampilan Tombol Aksi (Bawah) */
        .bottom-action { height: 35vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .btn-main-calc { 
            background: var(--primary); color: white; border: none; width: 100%; max-width: 300px;
            padding: 18px; border-radius: 20px; font-weight: 800; font-size: 1.1rem;
            box-shadow: 0 10px 20px rgba(0,61,112,0.2); transition: 0.3s;
        }
        .btn-main-calc:active { transform: scale(0.95); }

        /* Styling Modal Input */
        .modal-content { border-radius: 30px; border: none; }
        .custom-input { width: 100%; background: #f4f7fa; border: 2px solid #eee; border-radius: 15px; padding: 12px; margin-bottom: 12px; font-weight: 600; }
        .list-piring-mini { max-height: 200px; overflow-y: auto; margin-top: 10px; }
        .piring-tag { background: #e8f4fd; padding: 5px 12px; border-radius: 10px; display: inline-flex; align-items: center; margin: 4px; font-size: 0.8rem; font-weight: 600; color: var(--primary); }
    </style>
</head>
<body>

<div class="top-result">
    <div class="nav-top">
        <a href="dashboard_warga.html" class="btn-back">← KEMBALI</a>
        <div class="score-circle" id="circle-score">
            <b style="font-size: 1.5rem;" id="score-val">--</b>
            <small style="font-size: 0.5rem; font-weight: 800;">SKOR</small>
        </div>
    </div>

    <div class="bmi-mini">
        <div><small class="d-block" style="font-size: 0.6rem; opacity: 0.7; font-weight: 700;">STATUS BMI</small><b id="bmi-status">Memuat...</b></div>
        <div class="text-end"><small class="d-block" style="font-size: 0.6rem; opacity: 0.7; font-weight: 700;">ANGKA BMI</small><b id="bmi-val">0.0</b></div>
    </div>

    <div class="kkal-main"><span id="total-kkal">0</span> <small style="font-size: 1.2rem; opacity: 0.6;">kkal</small></div>

    <div class="macro-box">
        <div class="macro-item"><b id="total-p">0</b><small>PROT</small></div>
        <div class="macro-item"><b id="total-l">0</b><small>LEMAK</small></div>
        <div class="macro-item"><b id="total-k">0</b><small>KARBO</small></div>
        <div class="macro-item"><b id="total-fe">0</b><small>ZAT BESI</small></div>
    </div>

    <div class="feedback-card" id="fb-card">
        <b id="fb-title" style="color: var(--primary); font-size: 0.9rem;">Analisa Gizi</b>
        <p id="fb-text" class="small mb-0 mt-1" style="line-height: 1.3; color: #666;">Silakan tekan tombol di bawah untuk mulai menghitung makanan Anda.</p>
    </div>
</div>

<div class="bottom-action">
    <button class="btn-main-calc" data-bs-toggle="modal" data-bs-target="#modalHitung">🥗 HITUNG PIRINGKU</button>
    <p class="small text-muted mt-3">Data diperbarui otomatis dari profil warga</p>
</div>

<div class="modal fade" id="modalHitung" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">Atur Isi Piring</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <label class="small fw-bold text-muted mb-1">Cari & Pilih Makanan</label>
                <input type="text" id="cari-makan" class="custom-input" placeholder="Ketik nama makanan..." onkeyup="filterMenu()">
                <select id="select-makan" class="custom-input"></select>

                <div class="row g-2">
                    <div class="col-7">
                        <input type="number" id="berat-makan" class="custom-input" value="100" placeholder="Berat (gram)">
                    </div>
                    <div class="col-5">
                        <button class="btn btn-primary w-100 h-75 rounded-4 fw-bold" onclick="tambahKePiring()">+ Tambah</button>
                    </div>
                </div>

                <div class="list-piring-mini" id="list-piring-modal">
                    </div>

                <hr>
                <button class="btn btn-success w-100 py-3 rounded-4 fw-bold shadow" onclick="selesaiHitung()">LIHAT HASIL ANALISA</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw3u6tCWbAhjH-BOAXzCDHs72_gmtuQr9BrQn5jAP2F4N14EpUKTgUVYoWgSxHHZBVbQw/exec";
    let databaseGizi = [], isiPiring = [], riwayatPenyakit = "Normal", userBMI = 0;

    function cleanNum(val) {
        if (!val) return 0;
        let s = val.toString().replace(/,/g, '.').replace(/[^0-9.-]/g, '');
        return parseFloat(s) || 0;
    }

    async function init() {
        const nik = localStorage.getItem('nik_login');
        try {
            const res = await fetch(`${API_URL}?action=get_all_sheets_data`);
            const db = await res.json();
            
            // Sync Data Penduduk (Sesuai script dashboard)
            const user = db.data.Master_Data_Penduduk.find(r => r[0].toString().trim() === nik.trim());
            if(user) {
                const tb = cleanNum(user[12]); 
                const bb = cleanNum(user[13]); 
                riwayatPenyakit = (user[14] || "Normal").toLowerCase();
                
                if(bb > 0 && tb > 0) {
                    userBMI = (bb / ((tb/100)**2)).toFixed(1);
                    document.getElementById('bmi-val').innerText = userBMI;
                    updateBMIStatus(userBMI);
                }
            }

            // Load Database Gizi
            databaseGizi = db.data.master_gizi.filter(r => r[0] && !isNaN(cleanNum(r[1])));
            renderSelect(databaseGizi);
        } catch (e) { console.error("Koneksi Error"); }
    }

    function updateBMIStatus(bmi) {
        let st = "", cl = "#fff";
        if(bmi < 18.5) { st = "Kurus"; cl = "#3498db"; }
        else if(bmi < 25) { st = "Normal"; cl = "#2ecc71"; }
        else if(bmi < 30) { st = "Gemuk"; cl = "#f1c40f"; }
        else { st = "Obesitas"; cl = "#e74c3c"; }
        document.getElementById('bmi-status').innerText = st;
        document.getElementById('bmi-status').style.color = cl;
    }

    function renderSelect(data) {
        const sel = document.getElementById('select-makan');
        sel.innerHTML = data.map(r => `<option value="${r[0]}">${r[0]} (${cleanNum(r[1])} kkal/100g)</option>`).join("");
    }

    function filterMenu() {
        const key = document.getElementById('cari-makan').value.toLowerCase();
        const filt = databaseGizi.filter(r => r[0].toString().toLowerCase().includes(key));
        renderSelect(filt);
    }

    function tambahKePiring() {
        const n = document.getElementById('select-makan').value;
        const b = parseFloat(document.getElementById('berat-makan').value) || 0;
        const d = databaseGizi.find(r => r[0] === n);
        
        if(d && b > 0) {
            const f = b / 100;
            isiPiring.push({
                nama: d[0], berat: b,
                kkal: cleanNum(d[1])*f, p: cleanNum(d[2])*f,
                l: cleanNum(d[3])*f, k: cleanNum(d[4])*f, fe: cleanNum(d[5])*f
            });
            renderPiringModal();
        }
    }

    function renderPiringModal() {
        const cont = document.getElementById('list-piring-modal');
        cont.innerHTML = isiPiring.map((it, idx) => `
            <span class="piring-tag">
                ${it.nama} (${it.berat}g) 
                <b class="ms-2 text-danger" style="cursor:pointer" onclick="hapusItem(${idx})">✕</b>
            </span>
        `).join("");
    }

    function hapusItem(idx) {
        isiPiring.splice(idx, 1);
        renderPiringModal();
    }

    function selesaiHitung() {
        if(isiPiring.length === 0) {
            alert("Piring masih kosong!");
            return;
        }

        // Hitung Total
        let tk=0, tp=0, tl=0, tka=0, tfe=0;
        isiPiring.forEach(it => {
            tk += it.kkal; tp += it.p; tl += it.l; tka += it.k; tfe += it.fe;
        });

        // Update UI Utama
        document.getElementById('total-kkal').innerText = tk.toFixed(0);
        document.getElementById('total-p').innerText = tp.toFixed(1);
        document.getElementById('total-l').innerText = tl.toFixed(1);
        document.getElementById('total-k').innerText = tka.toFixed(1);
        document.getElementById('total-fe').innerText = tfe.toFixed(1);

        analisaAI(tk, tp, tl, tka);

        // Tutup Modal
        const modal = bootstrap.Modal.getInstance(document.getElementById('modalHitung'));
        modal.hide();
    }

    function analisaAI(kkal, p, l, k) {
        let skor = 100, title = "✅ Gizi Seimbang", warna = "#27ae60", msg = "Komposisi piring Anda sudah sangat baik.";

        if(userBMI >= 25 && k > (kkal * 0.6 / 4)) {
            skor -= 30; title = "⚠️ Kurangi Karbo"; warna = "#f1c40f";
            msg = "BMI Anda tinggi. Disarankan mengurangi porsi nasi/karbohidrat dalam piring ini.";
        }

        const menuStr = isiPiring.map(i => i.nama.toLowerCase()).join(" ");
        if(riwayatPenyakit.includes("asam urat") && (menuStr.includes("bayam") || menuStr.includes("kangkung"))) {
            skor -= 40; title = "❌ Bahaya Asam Urat"; warna = "#e74c3c";
            msg = "Piring mengandung sayuran hijau (bayam/kangkung) yang dilarang untuk riwayat asam urat Anda.";
        }

        document.getElementById('score-val').innerText = skor;
        document.getElementById('circle-score').style.borderColor = warna;
        document.getElementById('fb-card').style.borderLeftColor = warna;
        document.getElementById('fb-title').innerText = title;
        document.getElementById('fb-title').style.color = warna;
        document.getElementById('fb-text').innerText = msg;
    }

    window.onload = init;
</script>
</body>
</html>
