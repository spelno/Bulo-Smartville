<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Bebas - Bulo SmartVille</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #003d70; --bg: #f8fafd; }
        body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 50px; }
        
        .header-section { padding: 30px 20px; background: white; border-radius: 0 0 30px 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); text-align: center; }
        .card-calc { border-radius: 25px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.05); background: white; padding: 25px; margin-top: -30px; }
        
        /* Piring Visual Dinamis */
        .plate-container {
            width: 180px; height: 180px; border-radius: 50%; border: 8px solid #fff;
            margin: 20px auto; position: relative; overflow: hidden; background: #eee;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column;
        }
        .fill-bar { width: 100%; transition: 0.5s ease; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.6rem; font-weight: 800; }
        
        /* Input Row */
        .food-row { background: #f9fbff; border-radius: 15px; padding: 10px; margin-bottom: 10px; border: 1px solid #edf2f7; }
        .form-control { border: none; background: transparent; font-size: 0.9rem; font-weight: 600; padding: 5px; }
        .form-control:focus { box-shadow: none; border-bottom: 2px solid var(--primary); border-radius: 0; }
        
        .analysis-box { 
            background: #001f3f; color: white; border-radius: 20px; padding: 20px; margin-top: 25px; 
            border-left: 8px solid #3498db;
        }
        .btn-add { color: var(--primary); font-weight: 800; font-size: 0.75rem; text-decoration: none; cursor: pointer; }
        .badge-disease { background: #ff4757; padding: 5px 12px; border-radius: 50px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="header-section">
    <img src="Logo_Bulo.png" width="45" class="mb-2">
    <h5 class="fw-bold mb-0">Analisis Piring Bebas</h5>
    <p class="text-muted small">Input apa saja yang Bapak/Ibu makan hari ini</p>
</div>

<div class="container">
    <div class="card-calc">
        <div class="plate-container" id="visual-plate">
            <div style="height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; color: #bbb; font-size: 0.7rem;">Piring Kosong</div>
        </div>

        <div class="mb-2 d-flex justify-content-between align-items-center">
            <span class="badge-disease">Riwayat: <span id="user-disease">Memuat...</span></span>
            <span class="btn-add" onclick="tambahBaris()">+ TAMBAH MENU</span>
        </div>

        <div id="food-container">
            <div class="food-row row g-0 align-items-center">
                <div class="col-7">
                    <input type="text" class="form-control food-name" placeholder="Nama Makanan (Contoh: Nasi Putih)" oninput="analisisOtomatis()">
                </div>
                <div class="col-4">
                    <input type="number" class="form-control food-weight text-end" placeholder="Gram" oninput="analisisOtomatis()">
                </div>
                <div class="col-1 text-end">
                    <span style="cursor:pointer; color:#ccc;" onclick="hapusBaris(this)">×</span>
                </div>
            </div>
        </div>

        <div class="analysis-box">
            <div class="small opacity-75 fw-bold mb-2 text-uppercase">Analisis "Notes of OD":</div>
            <div class="h4 fw-bold mb-2"><span id="total-berat">0</span> <small style="font-size: 0.8rem;">Total Gram</small></div>
            <p id="saran-bebas" class="small mb-0" style="line-height: 1.5; color: #cbd5e1;">Silakan ketik menu makanan Bapak/Ibu dan beratnya.</p>
        </div>

        <button class="btn w-100 mt-4 py-3 fw-bold text-white rounded-pill shadow-sm" style="background: var(--primary);" onclick="window.location.href='dashboard_warga.html'">KEMBALI KE DASHBOARD</button>
    </div>
</div>

<script>
    const API_URL = "ISI_URL_DEPLOY_GS_BAPAK";
    let riwayatPenyakit = "Normal";

    // Ambil penyakit warga secara otomatis
    async function loadUserHealth() {
        const nik = localStorage.getItem('nik_login');
        try {
            const res = await fetch(`${API_URL}?action=get_all_sheets_data`);
            const db = await res.json();
            const user = db.data.Master_Data_Penduduk.find(r => r[0].toString().trim() === nik);
            if(user) {
                riwayatPenyakit = user[6] || "Normal";
                document.getElementById('user-disease').innerText = riwayatPenyakit;
            }
        } catch(e) { document.getElementById('user-disease').innerText = "Normal"; }
    }

    function tambahBaris() {
        const container = document.getElementById('food-container');
        const div = document.createElement('div');
        div.className = "food-row row g-0 align-items-center";
        div.innerHTML = `
            <div class="col-7"><input type="text" class="form-control food-name" placeholder="Nama Makanan" oninput="analisisOtomatis()"></div>
            <div class="col-4"><input type="number" class="form-control food-weight text-end" placeholder="Gram" oninput="analisisOtomatis()"></div>
            <div class="col-1 text-end"><span style="cursor:pointer; color:#ccc;" onclick="hapusBaris(this)">×</span></div>
        `;
        container.appendChild(div);
    }

    function hapusBaris(el) {
        el.closest('.food-row').remove();
        analisisOtomatis();
    }

    function analisisOtomatis() {
        const names = document.querySelectorAll('.food-name');
        const weights = document.querySelectorAll('.food-weight');
        const plate = document.getElementById('visual-plate');
        const saran = document.getElementById('saran-bebas');
        
        let total = 0;
        let dataInput = [];

        weights.forEach((w, i) => {
            const val = parseFloat(w.value) || 0;
            const name = names[i].value.toLowerCase();
            if(val > 0) {
                total += val;
                dataInput.push({ name, weight: val });
            }
        });

        document.getElementById('total-berat').innerText = total;

        // Visualisasi Piring (Warna dinamis)
        plate.innerHTML = "";
        const colors = ["#f1c40f", "#e74c3c", "#27ae60", "#3498db", "#9b59b6", "#e67e22"];
        dataInput.forEach((item, index) => {
            const height = (item.weight / total) * 100;
            const bar = document.createElement('div');
            bar.className = "fill-bar";
            bar.style.height = height + "%";
            bar.style.backgroundColor = colors[index % colors.length];
            bar.innerText = item.name.substring(0, 10);
            plate.appendChild(bar);
        });

        // LOGIKA ANALISIS "TRUTH OVER NOISE"
        let pesan = "Komposisi makanan Anda sedang dianalisis...";
        const p = riwayatPenyakit.toLowerCase();

        // Cari kata kunci makanan
        const hasNasi = dataInput.some(d => d.name.includes('nasi') || d.name.includes('mie') || d.name.includes('tepung'));
        const beratNasi = dataInput.filter(d => d.name.includes('nasi') || d.name.includes('mie')).reduce((a, b) => a + b.weight, 0);
        const hasAsin = dataInput.some(d => d.name.includes('asin') || d.name.includes('garam') || d.name.includes('kaldu'));
        const hasDaging = dataInput.some(d => d.name.includes('daging') || d.name.includes('sapi') || d.name.includes('babi'));
        const beratDaging = dataInput.filter(d => d.name.includes('daging') || d.name.includes('sapi') || d.name.includes('babi')).reduce((a, b) => a + b.weight, 0);

        if(total === 0) {
            pesan = "Silakan masukkan menu makanan Bapak/Ibu untuk melihat analisis kesehatan.";
        } else if(p.includes('diabetes')) {
            if(beratNasi > 150) pesan = `⚠️ <b>Notes of OD:</b> Bapak/Ibu memiliki riwayat Diabetes. Nasi/Mie sebanyak ${beratNasi}g itu terlalu banyak. Kurangi setengahnya!`;
            else pesan = "✅ Porsi karbohidrat sudah aman untuk penderita Diabetes. Pertahankan.";
        } else if(p.includes('hipertensi') || p.includes('darah tinggi')) {
            if(hasAsin) pesan = "⚠️ <b>Notes of OD:</b> Ada menu asin/olahan terdeteksi. Untuk Hipertensi, ini sangat berbahaya bagi tekanan darah. Batasi asupannya.";
            else pesan = "✅ Pastikan menu ini tidak mengandung banyak penyedap rasa buatan.";
        } else if(p.includes('asam urat')) {
            if(beratDaging > 200) pesan = "⚠️ <b>Notes of OD:</b> Berat daging Anda ${beratDaging}g. Bagi penderita Asam Urat, ini akan memicu nyeri sendi besok pagi. Kurangi porsinya.";
            else pesan = "✅ Porsi protein hewani aman. Jangan lupa minum air mineral yang cukup.";
        } else {
            if(total > 1000) pesan = "⚠️ Porsi makan Bapak/Ibu sangat besar (1 Kg lebih). Jika ingin tetap sehat, bagi porsi ini untuk dua kali makan.";
            else pesan = "Menu Bapak/Ibu terlihat seimbang. Pastikan selalu ada sayuran hijau di setiap piring.";
        }

        saran.innerHTML = pesan;
    }

    window.onload = loadUserHealth;
</script>
</body>
</html>
