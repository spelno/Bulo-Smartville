<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Gizi - Bulo SmartVille</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary: #003d70; --bg: #f8fafd; }
        body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 50px; }
        
        .header-section { padding: 30px 20px; background: white; border-radius: 0 0 30px 30px; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .card-calc { border-radius: 25px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.05); background: white; padding: 25px; margin-top: -30px; }
        
        /* Visual Piring */
        .plate-container {
            width: 220px; height: 220px; border-radius: 50%; border: 8px solid #eee;
            margin: 20px auto; position: relative; overflow: hidden; background: #fff;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.05);
        }
        .portion { position: absolute; transition: 0.5s; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 800; color: white; text-align: center; }
        .karbo { background: #f1c40f; top: 0; left: 0; width: 50%; height: 50%; border-right: 2px solid white; border-bottom: 2px solid white; }
        .protein { background: #e74c3c; top: 0; right: 0; width: 50%; height: 50%; border-bottom: 2px solid white; }
        .sayur { background: #27ae60; bottom: 0; left: 0; width: 100%; height: 50%; }

        .input-label { font-size: 0.75rem; font-weight: 700; color: var(--primary); text-transform: uppercase; margin-bottom: 8px; display: block; }
        .form-select, .form-control { border-radius: 12px; border: 1px solid #eef2f7; padding: 12px; font-size: 0.9rem; }
        
        .result-box { background: #f1f5f9; border-radius: 20px; padding: 20px; margin-top: 25px; border-left: 6px solid var(--primary); }
        .disease-tag { background: #ff4757; color: white; padding: 4px 12px; border-radius: 50px; font-size: 0.65rem; font-weight: 800; }
    </style>
</head>
<body>

<div class="header-section text-center">
    <h4 class="fw-bold mb-1">Analisis Isi Piring</h4>
    <p class="text-muted small">Atur porsi makan harian Anda</p>
</div>

<div class="container">
    <div class="card-calc">
        <div class="plate-container">
            <div class="portion karbo" id="v-karbo">KARBO</div>
            <div class="portion protein" id="v-protein">PROTEIN</div>
            <div class="portion sayur" id="v-sayur">SAYUR & BUAH</div>
        </div>

        <div class="row g-3">
            <div class="col-12">
                <label class="input-label">Penyakit Penyerta</label>
                <select class="form-select" id="penyakit" onchange="updateAnalisis()">
                    <option value="none">Tidak Ada / Sehat</option>
                    <option value="diabetes">Diabetes (Gula Darah)</option>
                    <option value="hipertensi">Hipertensi (Darah Tinggi)</option>
                    <option value="asam_urat">Asam Urat</option>
                    <option value="kolesterol">Kolesterol Tinggi</option>
                </select>
            </div>

            <div class="col-6">
                <label class="input-label">Karbohidrat</label>
                <select class="form-select" id="in-karbo" onchange="updateAnalisis()">
                    <option value="nasi">Nasi Putih</option>
                    <option value="ubi">Ubi / Jagung</option>
                    <option value="mie">Mie / Tepung</option>
                </select>
            </div>
            
            <div class="col-6">
                <label class="input-label">Porsi Karbo</label>
                <select class="form-select" id="porsi-karbo" onchange="updateAnalisis()">
                    <option value="0.5">1/2 Piring</option>
                    <option value="0.25">1/4 Piring</option>
                    <option value="0.75">3/4 Piring</option>
                </select>
            </div>
        </div>

        <div class="result-box" id="hasil-analisis">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="fw-bold" style="color: var(--primary);">Rekomendasi Gizi:</span>
                <span id="tag-penyakit" class="disease-tag d-none">DIABETES</span>
            </div>
            <p id="saran-text" class="small text-muted mb-0">Silakan sesuaikan pilihan menu Anda untuk melihat analisis kesehatan.</p>
        </div>

        <button class="btn w-100 mt-4 py-3 fw-bold text-white rounded-pill" style="background: var(--primary);" onclick="window.location.href='dashboard_warga.html'">KEMBALI KE DASHBOARD</button>
    </div>
</div>

<script>
    function updateAnalisis() {
        const penyakit = document.getElementById('penyakit').value;
        const karbo = document.getElementById('in-karbo').value;
        const porsi = parseFloat(document.getElementById('porsi-karbo').value);
        
        const vKarbo = document.getElementById('v-karbo');
        const tag = document.getElementById('tag-penyakit');
        const saran = document.getElementById('saran-text');

        // Update Visual Piring
        vKarbo.style.width = (porsi * 100) + "%";
        
        // Logika Analisis Berdasarkan Penyakit & Isi Piring
        let pesan = "";
        tag.classList.add('d-none');

        if(penyakit === "diabetes") {
            tag.innerText = "KONTROL GULA";
            tag.classList.remove('d-none');
            if(karbo === "nasi" && porsi > 0.25) {
                pesan = "⚠️ <b>Bahaya:</b> Porsi nasi putih terlalu banyak untuk penderita Diabetes. Ganti ke <b>Ubi/Jagung</b> dan batasi maksimal 1/4 piring agar gula darah stabil.";
            } else {
                pesan = "✅ <b>Bagus:</b> Pilihan karbohidrat kompleks dan porsi kecil membantu menjaga indeks glikemik Anda.";
            }
        } 
        else if(penyakit === "hipertensi") {
            tag.innerText = "KONTROL GARAM";
            tag.classList.remove('d-none');
            pesan = "Pastikan lauk diproses dengan <b>sedikit garam</b>. Perbanyak porsi sayuran hijau (Hijau di piring) untuk membantu menurunkan tekanan darah.";
        }
        else if(penyakit === "asam_urat") {
            tag.innerText = "KONTROL PURIN";
            tag.classList.remove('d-none');
            pesan = "Hindari jeroan dan emping. Jika mengonsumsi protein, pilih ikan air tawar atau tahu/tempe dalam porsi sedang.";
        }
        else {
            if(porsi > 0.5) {
                pesan = "Porsi karbohidrat Anda terlalu dominan. Seimbangkan dengan menambah area <b>Hijau (Sayur)</b> agar pencernaan lebih sehat.";
            } else {
                pesan = "Porsi makan sudah seimbang sesuai prinsip Isi Piringku. Pertahankan pola makan ini.";
            }
        }

        saran.innerHTML = pesan;
    }

    // Jalankan sekali saat load
    window.onload = updateAnalisis;
</script>
</body>
</html>
