<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Gizi - Bulo SmartVille</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #003d70; --bg: #f8fafd; }
        body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; padding: 15px; }
        .card-main { border-radius: 25px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.08); background: white; padding: 20px; max-width: 500px; margin: auto; }
        .plate-box { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #fff; margin: 0 auto 15px; position: relative; overflow: hidden; background: #eef2f7; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column-reverse; }
        .fill-item { width: 100%; transition: 0.5s; }
        .food-row { background: #f9fbff; border-radius: 15px; padding: 10px; margin-bottom: 10px; border: 1px solid #edf2f7; position: relative; }
        .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: white; z-index: 1000; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: none; max-height: 200px; overflow-y: auto; }
        .suggestion-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #f8fafd; font-size: 0.8rem; }
        .suggestion-item:hover { background: #f0f7ff; }
        .analysis-box { background: #001f3f; color: white; border-radius: 15px; padding: 15px; margin-top: 15px; }
        .btn-dashboard { background: var(--primary); color: white; border-radius: 12px; font-weight: 800; padding: 12px; margin-top: 15px; text-decoration: none; display: block; text-align: center; width: 100%; border: none; }
    </style>
</head>
<body>

<div class="card-main">
    <div class="text-center mb-2">
        <h6 class="fw-bold m-0">Kalkulator Gizi</h6>
        <span class="badge rounded-pill bg-success mt-1" id="status-tag" style="font-size: 0.7rem;">MENGHUBUNGKAN...</span>
    </div>

    <div class="plate-box" id="visual-plate"></div>
    <div id="food-container"></div>
    
    <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="badge bg-light text-dark border" id="target-label" style="font-size: 0.7rem;">Target Fe: --</span>
        <button class="btn btn-sm btn-primary fw-bold rounded-pill" onclick="tambahBaris()">+ MENU</button>
    </div>

    <div class="row g-2 mb-3 text-center" style="font-size: 0.8rem;">
        <div class="col-4"><div class="p-2 bg-light rounded">KARBO<br><b id="t-kar">0</b>g</div></div>
        <div class="col-4"><div class="p-2 bg-light rounded">PRO<br><b id="t-pro">0</b>g</div></div>
        <div class="col-4"><div class="p-2 bg-light rounded">FE<br><b id="t-fe">0</b></div></div>
    </div>

    <div class="analysis-box">
        <div class="h4 fw-bold m-0"><span id="t-kal">0</span> <small style="font-size: 0.8rem">Kkal</small></div>
        <p id="saran-gizi" class="small mb-0 opacity-75 mt-1" style="font-size: 0.75rem;">Pilih menu dan masukkan berat (Gr)...</p>
    </div>

    <a href="dashboard_warga.html" class="btn-dashboard">KEMBALI KE DASHBOARD</a>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwzJx1Ar_wJ5Hnslv6cts_TTPrzHrGzh48dcg9S46pRlkRZWbtURX121NFQb-gJ0GwbEg/exec"; 
    let masterGizi = [], riwayatPenyakit = "Normal", targetFe = 9;

    async function init() {
        const nik = localStorage.getItem('nik_login');
        try {
            const res = await fetch(`${API_URL}?action=get_all_sheets_data`);
            const json = await res.json();
            if(json.success) {
                masterGizi = json.data["master_gizi"] || [];
                const penduduk = json.data["Master_Data_Penduduk"] || [];
                const akg = json.data["referensi_akg"] || [];
                const user = penduduk.find(r => r[0].trim() === nik);
                if(user) {
                    riwayatPenyakit = user[13] || "Normal";
                    document.getElementById('status-tag').innerText = "RIWAYAT: " + riwayatPenyakit.toUpperCase();
                    const statusWarga = user[6].trim();
                    const akgUser = akg.find(r => r[2] && r[2].trim() === statusWarga);
                    targetFe = akgUser ? parseFloat(akgUser[4]) : 9;
                    document.getElementById('target-label').innerText = "Target Fe: " + targetFe + "mg";
                } else {
                    document.getElementById('status-tag').innerText = "DATA TERHUBUNG";
                }
                tambahBaris();
            }
        } catch(e) { document.getElementById('status-tag').innerText = "KONEKSI ERROR"; }
    }

    function tambahBaris() {
        const id = Date.now();
        const html = `<div class="food-row" id="row-${id}"><div class="row g-1 align-items-center"><div class="col-8 position-relative"><input type="text" class="form-control form-control-sm border-0 bg-transparent fw-bold" placeholder="Cari..." oninput="searchFood(this, ${id})"><div class="suggestions shadow" id="suggest-${id}"></div></div><div class="col-3"><input type="number" class="form-control form-control-sm text-center border-0 shadow-sm" placeholder="Gr" oninput="hitung()"></div><div class="col-1 text-muted text-center" onclick="document.getElementById('row-${id}').remove(); hitung();" style="cursor:pointer">×</div></div><input type="hidden" class="nutri-data"></div>`;
        document.getElementById('food-container').insertAdjacentHTML('beforeend', html);
    }

    function searchFood(input, id) {
        const val = input.value.toLowerCase().trim();
        const box = document.getElementById(`suggest-${id}`);
        box.innerHTML = "";
        if(val.length < 1) { box.style.display = "none"; return; }
        
        // Filter: Hanya baris yang punya angka kalori di kolom B (indeks 1)
        const matches = masterGizi.filter(m => m[0] && m[0].toLowerCase().includes(val) && !isNaN(parseFloat(m[1].replace(',','.')))).slice(0, 5);
        
        if(matches.length > 0) {
            box.style.display = "block";
            matches.forEach(m => {
                const div = document.createElement('div');
                div.className = "suggestion-item";
                div.innerHTML = `<b>${m[0]}</b> <small class="text-muted d-block" style="font-size:0.6rem">${m[6]}</small>`;
                div.onclick = () => {
                    input.value = m[0];
                    box.style.display = "none";
                    const row = document.getElementById(`row-${id}`);
                    // Parsing angka yang mungkin mengandung koma
                    const parseVal = (v) => parseFloat(v.toString().replace(',', '.')) || 0;
                    row.querySelector('.nutri-data').value = JSON.stringify({
                        kal: parseVal(m[1]), pro: parseVal(m[2]), kar: parseVal(m[4]), fe: parseVal(m[5]), kat: m[6], nama: m[0]
                    });
                    hitung();
                };
                box.appendChild(div);
            });
        } else { box.style.display = "none"; }
    }

    function hitung() {
        let tKal = 0, tKar = 0, tPro = 0, tFe = 0, warnings = [];
        const plate = document.getElementById('visual-plate');
        plate.innerHTML = "";
        
        document.querySelectorAll('.food-row').forEach(row => {
            const gr = parseFloat(row.querySelector('input[type="number"]').value) || 0;
            const dataStr = row.querySelector('.nutri-data').value;
            if(gr > 0 && dataStr) {
                const d = JSON.parse(dataStr);
                const f = gr / 100;
                tKal += (d.kal * f); tKar += (d.kar * f); tPro += (d.pro * f); tFe += (d.fe * f);
                
                const item = document.createElement('div');
                item.className = "fill-item"; 
                item.style.height = Math.min((gr/5), 30) + "px";
                const kat = (d.kat || "").toLowerCase();
                item.style.backgroundColor = kat.includes("lauk") ? "#e74c3c" : (kat.includes("sayur") ? "#2ecc71" : "#f1c40f");
                plate.appendChild(item);
                
                if(riwayatPenyakit.toLowerCase().includes("asam urat") && d.nama.toLowerCase().includes("kangkung")) warnings.push("⚠️ Batasi kangkung.");
            }
        });
        document.getElementById('t-kal').innerText = Math.round(tKal);
        document.getElementById('t-kar').innerText = tKar.toFixed(1);
        document.getElementById('t-pro').innerText = tPro.toFixed(1);
        document.getElementById('t-fe').innerText = tFe.toFixed(2);
        
        if(tFe > 0 && tFe < targetFe) warnings.push(`💡 Butuh ${(targetFe - tFe).toFixed(1)}mg Zat Besi lagi.`);
        document.getElementById('saran-gizi').innerHTML = warnings.length > 0 ? warnings.join("<br>") : "Menu terpantau seimbang.";
    }
    window.onload = init;
</script>
</body>
</html>
