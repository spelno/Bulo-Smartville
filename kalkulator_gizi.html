<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Nutrisi Bulo - Notes of OD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #003d70; --bg: #f8fafd; }
        body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: 40px; }
        .card-main { border-radius: 30px; border: none; box-shadow: 0 15px 35px rgba(0,0,0,0.1); background: white; padding: 25px; margin-top: 20px; }
        
        /* Visual Piring Keren */
        .plate-box {
            width: 120px; height: 120px; border-radius: 50%; border: 5px solid #fff;
            margin: 10px auto 20px; position: relative; overflow: hidden; background: #eee;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); display: flex; flex-direction: column-reverse;
        }
        .fill-item { width: 100%; transition: 0.5s; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.6rem; font-weight: 800; border-top: 1px solid rgba(255,255,255,0.2); }

        .food-row { background: #f9fbff; border-radius: 15px; padding: 12px; margin-bottom: 12px; border: 1px solid #edf2f7; position: relative; }
        .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: white; z-index: 1000; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: none; max-height: 200px; overflow-y: auto; }
        .suggestion-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #f8fafd; font-size: 0.85rem; }
        .suggestion-item:hover { background: #f0f7ff; font-weight: bold; }

        .analysis-box { background: #001f3f; color: white; border-radius: 20px; padding: 20px; margin-top: 20px; }
        .btn-dashboard { background: var(--primary); color: white; border-radius: 18px; font-weight: 800; padding: 16px; margin-top: 20px; text-decoration: none; display: block; text-align: center; border: none; width: 100%; }
    </style>
</head>
<body>

<div class="container">
    <div class="card-main">
        <div class="text-center">
            <h5 class="fw-bold m-0">Smart Nutrisi Bulo</h5>
            <span class="badge rounded-pill bg-primary mt-2" id="status-tag">MENGHUBUNGKAN...</span>
        </div>

        <div class="plate-box" id="visual-plate"></div>

        <div id="food-container"></div>
        
        <div class="d-flex justify-content-between align-items-center mb-3">
            <small class="fw-bold text-muted" id="target-label">Target Fe: --</small>
            <button class="btn btn-sm btn-outline-primary fw-bold rounded-pill" onclick="tambahBaris()">+ TAMBAH MENU</button>
        </div>

        <div class="row g-2 mb-4 text-center">
            <div class="col-4"><div class="p-2 bg-light rounded-3"><small class="d-block text-muted small">KARBO</small><b id="t-kar">0</b>g</div></div>
            <div class="col-4"><div class="p-2 bg-light rounded-3"><small class="d-block text-muted small">PRO</small><b id="t-pro">0</b>g</div></div>
            <div class="col-4"><div class="p-2 bg-light rounded-3"><small class="d-block text-muted small">BESI</small><b id="t-fe">0</b></div></div>
        </div>

        <div class="analysis-box shadow">
            <div class="h2 fw-bold"><span id="t-kal">0</span> <small style="font-size: 1rem">Kkal</small></div>
            <p id="saran-od" class="small mb-0 opacity-75">Sistem siap, Pak OD.</p>
        </div>

        <a href="dashboard_warga.html" class="btn-dashboard">KEMBALI KE DASHBOARD</a>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbywcjbeOCEY3jEeVDFlYYTsebqht8fCGzPflcE2JqxCm1DpZ9AjROIo__C0iLEOvrxwFw/exec"; 
    let masterGizi = [];
    let riwayatPenyakit = "Normal";
    let targetFe = 9;

    async function init() {
        const nik = localStorage.getItem('nik_login');
        try {
            const res = await fetch(`${API_URL}?action=get_all_sheets_data`);
            const json = await res.json();
            if(json.success) {
                masterGizi = json.data["master_gizi"] || [];
                const penduduk = json.data["Master_Data_Penduduk"] || [];
                const akg = json.data["referensi_akg"] || [];
                
                const user = penduduk.find(r => r[0].toString().trim() === nik);
                if(user) {
                    riwayatPenyakit = user[13] || "Normal";
                    document.getElementById('status-tag').innerText = "RIWAYAT: " + riwayatPenyakit.toUpperCase();
                    document.getElementById('status-tag').className = "badge rounded-pill bg-danger";
                    
                    // Logic AKG Keren
                    const akgUser = akg.find(r => r[0].includes(user[6]) || r[2].includes(user[6]));
                    targetFe = akgUser ? parseFloat(akgUser[4]) : 9;
                    document.getElementById('target-label').innerText = "Target Fe: " + targetFe + "mg";
                }
                tambahBaris();
            }
        } catch(e) {
            document.getElementById('status-tag').innerText = "KONEKSI ERROR";
            document.getElementById('status-tag').className = "badge rounded-pill bg-warning text-dark";
        }
    }

    function tambahBaris() {
        const id = Date.now();
        const html = `
            <div class="food-row" id="row-${id}">
                <div class="row g-2 align-items-center">
                    <div class="col-8 position-relative">
                        <input type="text" class="form-control border-0 bg-transparent fw-bold" placeholder="Cari makanan..." oninput="searchFood(this, ${id})">
                        <div class="suggestions shadow" id="suggest-${id}"></div>
                    </div>
                    <div class="col-3">
                        <input type="number" class="form-control text-center border-0 shadow-sm" style="border-radius:10px" placeholder="Gr" oninput="hitung()">
                    </div>
                    <div class="col-1 text-muted" onclick="document.getElementById('row-${id}').remove(); hitung();" style="cursor:pointer">×</div>
                </div>
                <input type="hidden" class="nutri-data">
            </div>`;
        document.getElementById('food-container').insertAdjacentHTML('beforeend', html);
    }

    function searchFood(input, id) {
        const val = input.value.toLowerCase().trim();
        const box = document.getElementById(`suggest-${id}`);
        box.innerHTML = "";
        if(val.length < 1) { box.style.display = "none"; return; }

        const matches = masterGizi.filter(m => m[0] && m[0].toString().toLowerCase().includes(val) && !isNaN(parseFloat(m[1]))).slice(0, 5);

        if(matches.length > 0) {
            box.style.display = "block";
            matches.forEach(m => {
                const div = document.createElement('div');
                div.className = "suggestion-item";
                div.innerHTML = `<b>${m[0]}</b> <small class="text-muted d-block" style="font-size:0.7rem">${m[6]}</small>`;
                div.onclick = () => {
                    input.value = m[0];
                    box.style.display = "none";
                    const row = document.getElementById(`row-${id}`);
                    row.querySelector('.nutri-data').value = JSON.stringify({ kal: m[1], pro: m[2], kar: m[4], fe: m[5], kat: m[6], nama: m[0] });
                    hitung();
                };
                box.appendChild(div);
            });
        } else { box.style.display = "none"; }
    }

    function hitung() {
        let tKal = 0, tKar = 0, tPro = 0, tFe = 0;
        let warnings = [];
        const plate = document.getElementById('visual-plate');
        plate.innerHTML = "";

        document.querySelectorAll('.food-row').forEach(row => {
            const gr = parseFloat(row.querySelector('input[type="number"]').value) || 0;
            const dataStr = row.querySelector('.nutri-data').value;
            if(gr > 0 && dataStr) {
                const d = JSON.parse(dataStr);
                const f = gr / 100;
                tKal += (d.kal * f); tKar += (d.kar * f); tPro += (d.pro * f); tFe += (d.fe * f);

                // Visual Piring Logic
                const bar = document.createElement('div');
                bar.className = "fill-item";
                bar.style.height = (gr/5) + "px";
                bar.style.backgroundColor = d.kat.includes("Lauk") ? "#e74c3c" : (d.kat.includes("Sayur") ? "#27ae60" : "#f1c40f");
                bar.innerText = d.nama.substring(0,6);
                plate.appendChild(bar);

                // Analisis Penyakit
                const p = riwayatPenyakit.toLowerCase();
                if(p.includes("asam urat") && d.nama.toLowerCase().includes("kangkung")) warnings.push("⚠️ Kangkung tinggi purin!");
            }
        });

        document.getElementById('t-kal').innerText = Math.round(tKal);
        document.getElementById('t-kar').innerText = tKar.toFixed(1);
        document.getElementById('t-pro').innerText = tPro.toFixed(1);
        document.getElementById('t-fe').innerText = tFe.toFixed(2);
        
        if(tFe < targetFe && tFe > 0) warnings.push(`💡 Tambah ${(targetFe - tFe).toFixed(1)}mg Zat Besi lagi.`);
        document.getElementById('saran-od').innerHTML = warnings.length > 0 ? warnings.join("<br>") : "Menu terpantau seimbang.";
    }

    window.onload = init;
</script>
</body>
</html>
