<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Nutrisi Bulo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #003d70; --bg: #f8fafd; }
        body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; }
        .card-main { border-radius: 25px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.08); background: white; padding: 25px; margin-top: 20px; }
        .food-row { background: #f9fbff; border-radius: 15px; padding: 12px; margin-bottom: 12px; border: 1px solid #edf2f7; position: relative; }
        .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: white; z-index: 1000; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-height: 200px; overflow-y: auto; display: none; }
        .suggestion-item { padding: 12px; cursor: pointer; font-size: 0.9rem; border-bottom: 1px solid #f8fafd; }
        .nutri-box { background: #f1f5f9; padding: 15px; border-radius: 18px; text-align: center; }
        .analysis-box { background: #001f3f; color: white; border-radius: 20px; padding: 20px; margin-top: 20px; }
        .status-badge { font-size: 0.7rem; padding: 5px 12px; font-weight: 800; }
    </style>
</head>
<body>

<div class="container pb-5">
    <div class="card-main">
        <div class="text-center mb-4">
            <h5 class="fw-bold m-0">Smart Nutrisi Bulo</h5>
            <div id="status-container" class="mt-2">
                <span class="badge rounded-pill status-badge bg-warning text-dark" id="status-penyakit">MENGHUBUNGKAN...</span>
            </div>
        </div>

        <div id="food-container"></div>
        
        <div class="text-end mb-3">
            <button class="btn btn-sm btn-primary fw-bold rounded-pill" onclick="tambahBaris()">+ TAMBAH MENU</button>
        </div>

        <div class="row g-2 mb-4">
            <div class="col-4"><div class="nutri-box"><small class="d-block text-muted fw-bold">KARBO</small><span class="fw-bold" id="t-kar">0</span>g</div></div>
            <div class="col-4"><div class="nutri-box"><small class="d-block text-muted fw-bold">PRO</small><span class="fw-bold" id="t-pro">0</span>g</div></div>
            <div class="col-4"><div class="nutri-box"><small class="d-block text-muted fw-bold">BESI (Fe)</small><span class="fw-bold" id="t-fe">0</span></div></div>
        </div>

        <div class="analysis-box shadow">
            <div class="d-flex justify-content-between align-items-center">
                <small class="opacity-50 fw-bold">ANALISIS GIZI:</small>
                <small id="target-fe-info" class="badge bg-primary"></small>
            </div>
            <div class="h2 fw-bold my-2"><span id="t-kal">0</span> <small style="font-size: 1rem">Kkal</small></div>
            <p id="saran-od" class="small mb-0 opacity-75">Silakan pilih menu...</p>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbw7WxMKceAtGDj7JvDu0G1nHqw5RaT-DYKFRpO51j0yQwCC_geeXhnlumApH30xPTBdTQ/exec"; 
    let masterGizi = [];
    let riwayatWarga = "Normal";
    let targetFe = 0;

    async function init() {
        const nik = localStorage.getItem('nik_login');
        try {
            const res = await fetch(`${API_URL}?action=get_all_sheets_data`);
            const json = await res.json();
            
            if(json.success) {
                masterGizi = json.data["master_gizi"] || [];
                const penduduk = json.data["Master_Data_Penduduk"] || [];
                const akg = json.data["referensi_akg"] || [];
                
                const user = penduduk.find(r => r[0].toString().trim() === nik);
                
                if(user) {
                    riwayatWarga = user[13] || "Normal"; // Kolom N
                    const statusKeluarga = user[6] || ""; // Kolom G
                    
                    // Cari Target Fe dari referensi_akg (image_373821)
                    const akgMatch = akg.find(r => r[0].includes(statusKeluarga) || r[2].includes(statusKeluarga));
                    targetFe = akgMatch ? parseFloat(akgMatch[4]) : 9;

                    document.getElementById('status-penyakit').innerText = "RIWAYAT: " + riwayatWarga.toUpperCase();
                    document.getElementById('status-penyakit').className = "badge rounded-pill status-badge bg-danger";
                    document.getElementById('target-fe-info').innerText = "Target Fe: " + targetFe + "mg";
                }
                
                tambahBaris();
            }
        } catch(e) {
            document.getElementById('status-penyakit').innerText = "KONEKSI ERROR";
            console.error(e);
        }
    }

    function tambahBaris() {
        const id = Date.now();
        const html = `
            <div class="food-row" id="row-${id}">
                <div class="row g-2 align-items-center">
                    <div class="col-8 position-relative">
                        <input type="text" class="form-control border-0 bg-transparent fw-bold" placeholder="Cari makanan..." oninput="searchFood(this, ${id})">
                        <div class="suggestions shadow" id="suggest-${id}"></div>
                    </div>
                    <div class="col-3">
                        <input type="number" class="form-control text-center border-0 shadow-sm" style="border-radius:10px" placeholder="Gr" oninput="hitung()">
                    </div>
                    <div class="col-1 text-muted" onclick="document.getElementById('row-${id}').remove(); hitung();">×</div>
                </div>
                <input type="hidden" class="nutri-data">
            </div>`;
        document.getElementById('food-container').insertAdjacentHTML('beforeend', html);
    }

    function searchFood(input, id) {
        const val = input.value.toLowerCase().trim();
        const box = document.getElementById(`suggest-${id}`);
        box.innerHTML = "";
        if(val.length < 1) { box.style.display = "none"; return; }

        const matches = masterGizi.filter(m => 
            m[0] && m[0].toString().toLowerCase().includes(val) && !isNaN(parseFloat(m[1]))
        ).slice(0, 5);

        if(matches.length > 0) {
            box.style.display = "block";
            matches.forEach(m => {
                const div = document.createElement('div');
                div.className = "suggestion-item";
                div.innerHTML = `<b>${m[0]}</b> <small class="text-muted d-block">${m[6] || 'Menu'}</small>`;
                div.onclick = () => {
                    input.value = m[0];
                    box.style.display = "none";
                    const row = document.getElementById(`row-${id}`);
                    // Kal(1), Pro(2), Karbo(4), Fe(5), Kat(6)
                    row.querySelector('.nutri-data').value = JSON.stringify({
                        kal: m[1], pro: m[2], kar: m[4], fe: m[5], nama: m[0]
                    });
                    hitung();
                };
                box.appendChild(div);
            });
        } else { box.style.display = "none"; }
    }

    function hitung() {
        let tKal = 0, tKar = 0, tPro = 0, tFe = 0;
        let info = [];
        
        document.querySelectorAll('.food-row').forEach(row => {
            const gr = parseFloat(row.querySelector('input[type="number"]').value) || 0;
            const dataStr = row.querySelector('.nutri-data').value;
            if(gr > 0 && dataStr) {
                const d = JSON.parse(dataStr);
                const f = gr / 100;
                tKal += (d.kal * f); tKar += (d.kar * f); tPro += (d.pro * f); tFe += (d.fe * f);
                
                const p = riwayatWarga.toLowerCase();
                if(p.includes("asam urat") && d.nama.toLowerCase().includes("kangkung")) info.push("⚠️ Kangkung tinggi purin!");
            }
        });

        document.getElementById('t-kal').innerText = Math.round(tKal);
        document.getElementById('t-kar').innerText = tKar.toFixed(1);
        document.getElementById('t-pro').innerText = tPro.toFixed(1);
        document.getElementById('t-fe').innerText = tFe.toFixed(2);
        
        if(tFe < targetFe && tFe > 0) info.push(`💡 Kurang ${ (targetFe - tFe).toFixed(1) }mg Zat Besi lagi.`);
        
        document.getElementById('saran-od').innerHTML = info.length > 0 ? info.join("<br>") : "Menu terpantau aman.";
    }

    window.onload = init;
</script>
</body>
</html>
