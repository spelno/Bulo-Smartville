<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Nutrisi Bulo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #003d70; --bg: #f8fafd; }
        body { background: var(--bg); font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px; }
        .card-main { border-radius: 25px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.08); background: white; padding: 25px; }
        .food-row { background: #f9fbff; border-radius: 15px; padding: 12px; margin-bottom: 12px; border: 1px solid #edf2f7; position: relative; }
        .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: white; z-index: 1000; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: none; }
        .suggestion-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #f8fafd; font-size: 0.9rem; }
        .analysis-box { background: #001f3f; color: white; border-radius: 20px; padding: 20px; margin-top: 20px; }
        .btn-dashboard { background: var(--primary); color: white; border-radius: 15px; font-weight: 800; padding: 15px; margin-top: 20px; text-decoration: none; display: block; text-align: center; }
        .btn-dashboard:hover { color: #f1f1f1; opacity: 0.9; }
    </style>
</head>
<body>

<div class="container pb-5">
    <div class="card-main">
        <div class="text-center mb-4">
            <h5 class="fw-bold m-0">Smart Nutrisi Bulo</h5>
            <span class="badge rounded-pill bg-warning text-dark mt-2" id="status-koneksi">MENGHUBUNGKAN...</span>
        </div>

        <div id="food-container"></div>
        
        <div class="text-end mb-3">
            <button class="btn btn-sm btn-primary fw-bold rounded-pill" onclick="tambahBaris()">+ TAMBAH MENU</button>
        </div>

        <div class="row g-2 mb-4 text-center">
            <div class="col-4"><small class="d-block text-muted">KARBO</small><b id="t-kar">0</b>g</div>
            <div class="col-4"><small class="d-block text-muted">PRO</small><b id="t-pro">0</b>g</div>
            <div class="col-4"><small class="d-block text-muted">BESI</small><b id="t-fe">0</b></div>
        </div>

        <div class="analysis-box shadow">
            <div class="h2 fw-bold"><span id="t-kal">0</span> <small style="font-size: 1rem">Kkal</small></div>
            <p id="saran-od" class="small mb-0 opacity-75">Masukkan menu makanan...</p>
        </div>

        <a href="dashboard_warga.html" class="btn-dashboard">KEMBALI KE DASHBOARD</a>
    </div>
</div>

<script>
    // MASUKKAN URL HASIL DEPLOY TERBARU DI SINI
    const API_URL = "https://script.google.com/macros/s/AKfycbymaM1Ah-M5VRUywFlwGRz_Igao8GyMnQH8rfYgbR9eKMaDK7MEyo8CL8Dfo6KLcxmgqg/exec"; 
    let masterGizi = [];

    async function init() {
        try {
            const res = await fetch(`${API_URL}?action=get_all_sheets_data`);
            const json = await res.json();
            if(json.success) {
                masterGizi = json.data["master_gizi"] || [];
                document.getElementById('status-koneksi').innerText = "DATA TERHUBUNG";
                document.getElementById('status-koneksi').className = "badge rounded-pill bg-success";
                tambahBaris();
            }
        } catch(e) {
            document.getElementById('status-koneksi').innerText = "KONEKSI ERROR";
            document.getElementById('status-koneksi').className = "badge rounded-pill bg-danger";
        }
    }

    function tambahBaris() {
        const id = Date.now();
        const html = `
            <div class="food-row" id="row-${id}">
                <div class="row g-2 align-items-center">
                    <div class="col-8 position-relative">
                        <input type="text" class="form-control border-0 bg-transparent fw-bold" placeholder="Cari makanan..." oninput="searchFood(this, ${id})">
                        <div class="suggestions shadow" id="suggest-${id}"></div>
                    </div>
                    <div class="col-3">
                        <input type="number" class="form-control text-center border-0 shadow-sm" style="border-radius:10px" placeholder="Gr" oninput="hitung()">
                    </div>
                    <div class="col-1 text-muted" onclick="document.getElementById('row-${id}').remove(); hitung();">×</div>
                </div>
                <input type="hidden" class="nutri-data">
            </div>`;
        document.getElementById('food-container').insertAdjacentHTML('beforeend', html);
    }

    function searchFood(input, id) {
        const val = input.value.toLowerCase();
        const box = document.getElementById(`suggest-${id}`);
        box.innerHTML = "";
        if(val.length < 1) { box.style.display = "none"; return; }

        const matches = masterGizi.filter(m => m[0] && m[0].toString().toLowerCase().includes(val) && !isNaN(parseFloat(m[1]))).slice(0, 5);

        if(matches.length > 0) {
            box.style.display = "block";
            matches.forEach(m => {
                const div = document.createElement('div');
                div.className = "suggestion-item";
                div.innerHTML = `<b>${m[0]}</b>`;
                div.onclick = () => {
                    input.value = m[0];
                    box.style.display = "none";
                    const row = document.getElementById(`row-${id}`);
                    row.querySelector('.nutri-data').value = JSON.stringify({ kal: m[1], pro: m[2], kar: m[4], fe: m[5] });
                    hitung();
                };
                box.appendChild(div);
            });
        } else { box.style.display = "none"; }
    }

    function hitung() {
        let tKal = 0, tKar = 0, tPro = 0, tFe = 0;
        document.querySelectorAll('.food-row').forEach(row => {
            const gr = parseFloat(row.querySelector('input[type="number"]').value) || 0;
            const dataStr = row.querySelector('.nutri-data').value;
            if(gr > 0 && dataStr) {
                const d = JSON.parse(dataStr);
                const f = gr / 100;
                tKal += (d.kal * f); tKar += (d.kar * f); tPro += (d.pro * f); tFe += (d.fe * f);
            }
        });
        document.getElementById('t-kal').innerText = Math.round(tKal);
        document.getElementById('t-kar').innerText = tKar.toFixed(1);
        document.getElementById('t-pro').innerText = tPro.toFixed(1);
        document.getElementById('t-fe').innerText = tFe.toFixed(2);
    }

    window.onload = init;
</script>
</body>
</html>
